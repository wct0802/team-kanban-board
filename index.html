<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>团队任务看板 · Team Kanban Board</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <span class="brand-logo">▦</span>
      <div class="brand-text">
        <h1>团队任务看板</h1>
        <p class="brand-sub">Team Kanban Board</p>
      </div>
    </div>
    <div class="header-tools">
      <span class="stats" id="stats">共 0 个任务</span>
      <button class="btn btn-primary" id="btn-add" type="button">＋ 新建任务</button>
    </div>
  </header>

  <main class="board" id="board">
    <section class="column" data-status="todo">
      <header class="column-head">
        <h2><i class="dot dot-todo"></i>待办</h2>
        <span class="count" data-count="todo">0</span>
      </header>
      <ul class="task-list" data-status="todo"></ul>
    </section>

    <section class="column" data-status="doing">
      <header class="column-head">
        <h2><i class="dot dot-doing"></i>进行中</h2>
        <span class="count" data-count="doing">0</span>
      </header>
      <ul class="task-list" data-status="doing"></ul>
    </section>

    <section class="column" data-status="done">
      <header class="column-head">
        <h2><i class="dot dot-done"></i>已完成</h2>
        <span class="count" data-count="done">0</span>
      </header>
      <ul class="task-list" data-status="done"></ul>
    </section>
  </main>
  <p class="empty-tip" id="empty-tip" hidden>看板还是空的，点击右上角「新建任务」添加第一个任务。</p>

  <dialog class="dialog" id="task-dialog">
    <form id="task-form">
      <h2>新建任务</h2>
      <label class="field">
        <span>任务标题 <em>*</em></span>
        <input type="text" id="input-title" maxlength="60" required placeholder="例如：实现拖拽排序" />
      </label>
      <label class="field">
        <span>任务描述</span>
        <textarea id="input-desc" rows="3" maxlength="200" placeholder="补充说明，可留空"></textarea>
      </label>
      <footer class="dialog-actions">
        <button class="btn" type="button" id="btn-cancel">取消</button>
        <button class="btn btn-primary" type="submit">保存</button>
      </footer>
    </form>
  </dialog>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
